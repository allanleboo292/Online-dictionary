<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Dictionary</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav>
            <h2>Online Dictionary</h2>
            <ul>
                <li> <a href="Home">Home</a></li>
                <li> <a href="About">About</a></li>
                <li><a href="#favourites">Favourite</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="hero">
            <h1>Discover the meaning of every word</h1>
            <p>Search for a word and discover its meaning</p>
        </section>
        <section id="search-section">
            <form id="search-form">
                <input type="search" id="search-input" placeholder="Enter a word">
                <button type="submit">Submit</button>

                <p id="message"></p>
            </form>
        </section>
        <section id="word-of-day">
            <h2>Word of the Day</h2>
            <h3>Knowledge</h3>
            <p>The fact or information about something</p>
        </section>
        <!-- Result section -->
        <section id="dictionary-result">
            <h2 id="word"></h2>
            <p id="pronunciation"></p>

            <audio id="pronunciation-audio" controls hidden>
                Your browser does not support audio.
            </audio>
            <p id="part-of-speech"></p>
            <div id="meaning">
                <h3>Meaning</h3>
                <p id="meaning-text"></p>
            </div>
            <div id="example">
                <h3>Example</h3>
                <p id="example-text"></p>
            </div>
            <div id="synonyms">
                <h3>Synonyms</h3>
                <p id="synonyms-text"></p>
            </div>
        </section>
        <section id="favourites">
            <h2>My Favourite Words</h2>
            <ul id="favourite-list"></ul>
        </section>
    </main>
    <footer>
        <p>
            &copy; 2026 online dictionary
        </p>
    </footer>
    <script src="js/script.js"></script>
</body>

</html>
